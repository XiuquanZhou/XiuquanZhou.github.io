<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Quantum and functional chalcogenide materials</title>
<desc id="desc">A simplified schematic showing topochemical control in layered chalcogenides connected to electronic and magnetic behavior.</desc>
<defs>
<style>
.bg{fill:#f7f8f8}.panel{fill:#ffffff;stroke:#d9dee3;stroke-width:3}.gold{fill:#d7bf55}.purple{fill:#7d5bd6}.red{fill:#b56a67}.dark{fill:#2b3035}.sulfur{fill:#c5cf25}.line{stroke:#2b3035;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:#7c8792;stroke-width:3;fill:none}.band1{stroke:#00a987;stroke-width:5;fill:none}.band2{stroke:#d7bf55;stroke-width:5;fill:none}.band3{stroke:#b56a67;stroke-width:5;fill:none}.label{font-family:Arial,Helvetica,sans-serif;font-size:31px;font-weight:700;fill:#2b3035}.small{font-family:Arial,Helvetica,sans-serif;font-size:24px;fill:#46505a}.tiny{font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#5c6670}
</style>
<marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
<path d="M1,1 L13,7 L1,13 Z" fill="#2b3035"/>
</marker>
</defs>
<rect class="bg" width="1200" height="675" rx="24"/>
<text x="600" y="64" text-anchor="middle" class="label">Structure control connects to properties</text>
<text x="600" y="101" text-anchor="middle" class="small">Layered chalcogenides can be tuned by composition and topochemical reactions.</text>

<rect x="72" y="154" width="300" height="330" rx="18" class="panel"/>
<text x="222" y="202" text-anchor="middle" class="label">Layered solid</text>
<text x="222" y="232" text-anchor="middle" class="tiny">K-rich nickel sulfide</text>
<g transform="translate(130 278)">
<g stroke="#7c8792" stroke-width="3">
<line x1="0" y1="0" x2="184" y2="0"/><line x1="0" y1="64" x2="184" y2="64"/><line x1="0" y1="128" x2="184" y2="128"/>
</g>
<g>
<circle cx="24" cy="0" r="13" class="red"/><circle cx="56" cy="0" r="13" class="sulfur"/><circle cx="88" cy="0" r="13" class="red"/><circle cx="120" cy="0" r="13" class="sulfur"/><circle cx="152" cy="0" r="13" class="red"/>
<circle cx="24" cy="64" r="13" class="red"/><circle cx="56" cy="64" r="13" class="sulfur"/><circle cx="88" cy="64" r="13" class="red"/><circle cx="120" cy="64" r="13" class="sulfur"/><circle cx="152" cy="64" r="13" class="red"/>
<circle cx="24" cy="128" r="13" class="red"/><circle cx="56" cy="128" r="13" class="sulfur"/><circle cx="88" cy="128" r="13" class="red"/><circle cx="120" cy="128" r="13" class="sulfur"/><circle cx="152" cy="128" r="13" class="red"/>
</g>
<circle cx="-18" cy="32" r="16" class="purple"/><circle cx="202" cy="32" r="16" class="purple"/>
<circle cx="-18" cy="96" r="16" class="purple"/><circle cx="202" cy="96" r="16" class="purple"/>
</g>

<line x1="400" y1="320" x2="520" y2="320" class="line" marker-end="url(#arrow)"/>
<text x="460" y="288" text-anchor="middle" class="tiny">K deintercalation</text>

<rect x="548" y="154" width="300" height="330" rx="18" class="panel"/>
<text x="698" y="202" text-anchor="middle" class="label">Tuned solid</text>
<text x="698" y="232" text-anchor="middle" class="tiny">layer spacing and carriers change</text>
<g transform="translate(606 270)">
<g stroke="#7c8792" stroke-width="3">
<line x1="0" y1="0" x2="184" y2="0"/><line x1="0" y1="84" x2="184" y2="84"/><line x1="0" y1="168" x2="184" y2="168"/>
</g>
<g>
<circle cx="24" cy="0" r="13" class="red"/><circle cx="56" cy="0" r="13" class="sulfur"/><circle cx="88" cy="0" r="13" class="red"/><circle cx="120" cy="0" r="13" class="sulfur"/><circle cx="152" cy="0" r="13" class="red"/>
<circle cx="24" cy="84" r="13" class="red"/><circle cx="56" cy="84" r="13" class="sulfur"/><circle cx="88" cy="84" r="13" class="red"/><circle cx="120" cy="84" r="13" class="sulfur"/><circle cx="152" cy="84" r="13" class="red"/>
<circle cx="24" cy="168" r="13" class="red"/><circle cx="56" cy="168" r="13" class="sulfur"/><circle cx="88" cy="168" r="13" class="red"/><circle cx="120" cy="168" r="13" class="sulfur"/><circle cx="152" cy="168" r="13" class="red"/>
</g>
<circle cx="-18" cy="42" r="9" class="purple" opacity=".35"/><circle cx="202" cy="126" r="9" class="purple" opacity=".35"/>
</g>

<line x1="876" y1="320" x2="996" y2="320" class="line" marker-end="url(#arrow)"/>
<text x="936" y="288" text-anchor="middle" class="tiny">properties</text>

<rect x="1016" y="154" width="132" height="330" rx="18" class="panel"/>
<text x="1082" y="202" text-anchor="middle" class="label">States</text>
<g transform="translate(1042 250)">
<path d="M0 86 C22 30 42 30 64 86" class="band1"/>
<path d="M0 86 C22 142 42 142 64 86" class="band1"/>
<line x1="0" y1="164" x2="64" y2="164" class="band2"/>
<line x1="0" y1="190" x2="64" y2="190" class="band3"/>
<line x1="32" y1="42" x2="32" y2="214" stroke="#c4ccd3" stroke-width="2"/>
</g>
<text x="1082" y="446" text-anchor="middle" class="tiny">electronic</text>
<text x="1082" y="473" text-anchor="middle" class="tiny">and magnetic</text>

<rect x="256" y="580" width="688" height="46" rx="23" fill="#2b3035"/>
<text x="600" y="611" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#ffffff">topochemical control tunes structure, composition, and quantum behavior</text>
</svg>
