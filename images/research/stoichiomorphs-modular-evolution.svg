<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Modular structural evolution and stoichiomorphs</title>
<desc id="desc">A simplified sequence showing related structural modules evolving into a homologous family with conserved composition.</desc>
<defs>
<style>
.bg{fill:#f7f8f8}.panel{fill:#ffffff;stroke:#d9dee3;stroke-width:3}.gold{fill:#d7bf55}.teal{fill:#00a987}.red{fill:#b56a67}.dark{fill:#2b3035}.blue{fill:#6f8caf}.line{stroke:#2b3035;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:#7c8792;stroke-width:3;fill:none}.dash{stroke:#9aa4ad;stroke-width:4;stroke-dasharray:10 10;fill:none}.label{font-family:Arial,Helvetica,sans-serif;font-size:31px;font-weight:700;fill:#2b3035}.small{font-family:Arial,Helvetica,sans-serif;font-size:24px;fill:#46505a}.tiny{font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#5c6670}
</style>
<marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
<path d="M1,1 L13,7 L1,13 Z" fill="#2b3035"/>
</marker>
</defs>
<rect class="bg" width="1200" height="675" rx="24"/>
<text x="600" y="64" text-anchor="middle" class="label">Modular structural evolution</text>
<text x="600" y="101" text-anchor="middle" class="small">Related solids can share composition windows while their structural modules grow and rearrange.</text>

<rect x="76" y="168" width="265" height="360" rx="18" class="panel"/>
<text x="208" y="214" text-anchor="middle" class="label">Module</text>
<text x="208" y="249" text-anchor="middle" class="label">library</text>
<g transform="translate(130 292)">
<polygon points="0,78 45,0 90,78" fill="#dfe7ec" stroke="#6b7280" stroke-width="3"/>
<circle cx="0" cy="78" r="11" class="red"/><circle cx="45" cy="0" r="11" class="blue"/><circle cx="90" cy="78" r="11" class="red"/>
<circle cx="45" cy="56" r="11" class="dark"/>
<text x="45" y="124" text-anchor="middle" class="small">A</text>
</g>
<g transform="translate(220 312)">
<rect x="0" y="0" width="70" height="70" rx="9" fill="#eef2f4" stroke="#6b7280" stroke-width="3"/>
<circle cx="18" cy="18" r="10" class="teal"/><circle cx="52" cy="18" r="10" class="red"/><circle cx="18" cy="52" r="10" class="gold"/><circle cx="52" cy="52" r="10" class="dark"/>
<text x="35" y="118" text-anchor="middle" class="small">B</text>
</g>
<text x="208" y="480" text-anchor="middle" class="tiny">fragments available in flux</text>

<line x1="366" y1="348" x2="472" y2="348" class="line" marker-end="url(#arrow)"/>
<text x="419" y="316" text-anchor="middle" class="tiny">assemble</text>

<rect x="500" y="168" width="250" height="360" rx="18" class="panel"/>
<text x="625" y="214" text-anchor="middle" class="label">Evolving</text>
<text x="625" y="249" text-anchor="middle" class="label">modules</text>
<g transform="translate(548 298)">
<rect x="0" y="0" width="154" height="32" rx="16" fill="#eef2f4" stroke="#d9dee3" stroke-width="3"/>
<circle cx="24" cy="16" r="10" class="red"/><circle cx="58" cy="16" r="10" class="blue"/><circle cx="92" cy="16" r="10" class="red"/><circle cx="126" cy="16" r="10" class="dark"/>
<rect x="-20" y="70" width="194" height="32" rx="16" fill="#eef2f4" stroke="#d9dee3" stroke-width="3"/>
<circle cx="4" cy="86" r="10" class="red"/><circle cx="38" cy="86" r="10" class="blue"/><circle cx="72" cy="86" r="10" class="red"/><circle cx="106" cy="86" r="10" class="blue"/><circle cx="150" cy="86" r="10" class="dark"/>
<rect x="-40" y="140" width="234" height="32" rx="16" fill="#eef2f4" stroke="#d9dee3" stroke-width="3"/>
<circle cx="-16" cy="156" r="10" class="red"/><circle cx="18" cy="156" r="10" class="blue"/><circle cx="52" cy="156" r="10" class="red"/><circle cx="86" cy="156" r="10" class="blue"/><circle cx="120" cy="156" r="10" class="red"/><circle cx="170" cy="156" r="10" class="dark"/>
</g>
<path d="M626 335 L626 389 L626 444" class="line" marker-end="url(#arrow)"/>

<line x1="774" y1="348" x2="880" y2="348" class="line" marker-end="url(#arrow)"/>
<text x="827" y="316" text-anchor="middle" class="tiny">compare</text>

<rect x="908" y="168" width="216" height="360" rx="18" class="panel"/>
<text x="1016" y="214" text-anchor="middle" class="label">Homologous</text>
<text x="1016" y="249" text-anchor="middle" class="label">family</text>
<g transform="translate(956 302)">
<rect x="0" y="0" width="120" height="34" rx="17" fill="#eef2f4" stroke="#d9dee3" stroke-width="3"/>
<rect x="0" y="62" width="120" height="34" rx="17" fill="#eef2f4" stroke="#d9dee3" stroke-width="3"/>
<rect x="0" y="124" width="120" height="34" rx="17" fill="#eef2f4" stroke="#d9dee3" stroke-width="3"/>
<path d="M-18 -18 H138 V176 H-18 Z" class="dash"/>
<circle cx="20" cy="17" r="9" class="red"/><circle cx="50" cy="17" r="9" class="blue"/><circle cx="80" cy="17" r="9" class="red"/><circle cx="110" cy="17" r="9" class="dark"/>
<circle cx="20" cy="79" r="9" class="red"/><circle cx="50" cy="79" r="9" class="blue"/><circle cx="80" cy="79" r="9" class="red"/><circle cx="110" cy="79" r="9" class="dark"/>
<circle cx="20" cy="141" r="9" class="red"/><circle cx="50" cy="141" r="9" class="blue"/><circle cx="80" cy="141" r="9" class="red"/><circle cx="110" cy="141" r="9" class="dark"/>
</g>
<text x="1016" y="494" text-anchor="middle" class="tiny">conserved composition</text>

<rect x="272" y="582" width="656" height="44" rx="22" fill="#2b3035"/>
<text x="600" y="612" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#ffffff">stoichiomorphs organize structure change without losing chemical context</text>
</svg>
